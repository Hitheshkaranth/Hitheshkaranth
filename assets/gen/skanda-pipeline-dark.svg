<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"><style></style><defs><filter id="sm" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect x="8" y="8" width="1184" height="524" rx="14" fill="#09090b" stroke="#27272a" filter="url(#sm)"/><text x="32" y="56" font-size="20" font-weight="600" letter-spacing="-0.4" fill="#fafafa">How Skanda is built</text><text x="32" y="80" font-size="14" fill="#a1a1aa">The language model points with a [SEG] token; SAM 2 turns each pointer into an outline.</text><rect x="32" y="108" width="254" height="136" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/><rect x="48" y="124" width="32" height="32" rx="8" fill="#27272a" stroke="#27272a"/><g transform="translate(56,132) scale(0.6666666666666666)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"/></g><rect x="217.0" y="129" width="53" height="22" rx="11" fill="none" stroke="#27272a"/><text x="227" y="144" font-size="12" font-weight="600" fill="#fafafa">Input</text><text x="48" y="184" font-size="16" font-weight="600" fill="#fafafa">Image</text><text x="48" y="208" font-size="13" fill="#a1a1aa">Chest X-ray, CT or MRI</text><text x="48" y="228" font-size="13" fill="#a1a1aa">slice or 32-slice volume</text><line x1="290" y1="176.0" x2="318" y2="176.0" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/><rect x="322" y="108" width="254" height="136" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/><rect x="338" y="124" width="32" height="32" rx="8" fill="#27272a" stroke="#27272a"/><g transform="translate(346,132) scale(0.6666666666666666)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4"/></g><rect x="474.0" y="129" width="86" height="22" rx="11" fill="#27272a" stroke="none"/><text x="484" y="144" font-size="12" font-weight="600" fill="#fafafa">Fine-tuned</text><text x="338" y="184" font-size="16" font-weight="600" fill="#fafafa">Qwen3-VL-30B-A3B</text><text x="338" y="208" font-size="13" fill="#a1a1aa">31B MoE, ~3B active per token</text><text x="338" y="228" font-size="13" fill="#a1a1aa">LoRA r=64 · vision LoRA 11/27</text><line x1="580" y1="176.0" x2="608" y2="176.0" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/><rect x="612" y="108" width="254" height="136" rx="12" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/><rect x="628" y="124" width="32" height="32" rx="8" fill="#27272a" stroke="#27272a"/><g transform="translate(636,132) scale(0.6666666666666666)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><rect x="810.2" y="129" width="40" height="22" rx="11" fill="#fafafa" stroke="none"/><text x="820" y="144" font-size="12" font-weight="600" fill="#18181b">New</text><text x="628" y="184" font-size="16" font-weight="600" fill="#fafafa">[SEG] projector</text><text x="628" y="208" font-size="13" fill="#a1a1aa">Hidden state at each [SEG]</text><text x="628" y="228" font-size="13" fill="#a1a1aa">MLP 2048 → 2048 → 256</text><line x1="870" y1="176.0" x2="898" y2="176.0" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/><rect x="902" y="108" width="254" height="136" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/><rect x="918" y="124" width="32" height="32" rx="8" fill="#27272a" stroke="#27272a"/><g transform="translate(926,132) scale(0.6666666666666666)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><rect x="1054.0" y="129" width="86" height="22" rx="11" fill="#27272a" stroke="none"/><text x="1064" y="144" font-size="12" font-weight="600" fill="#fafafa">Fine-tuned</text><text x="918" y="184" font-size="16" font-weight="600" fill="#fafafa">SAM 2.1 decoder</text><text x="918" y="208" font-size="13" fill="#a1a1aa">One outline per finding</text><text x="918" y="228" font-size="13" fill="#a1a1aa">+ object score · 3D Dice</text><rect x="32" y="266" width="1136" height="34" rx="8" fill="#27272a" fill-opacity=".6" stroke="#27272a"/><text x="48" y="288" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fafafa">loss = CE(report) + 2.0·BCE(mask) + 0.5·Dice(mask) + 0.2·BCE(object) + 0.5·score-head</text><text x="32" y="332" font-size="13" font-weight="600" letter-spacing=".4" fill="#a1a1aa">TRAINING · 1× NVIDIA DGX SPARK (GB10, 128 GB)</text><rect x="32" y="350" width="248" height="74" rx="12" fill="#09090b" stroke="#27272a"/><circle cx="60" cy="376" r="12" fill="#fafafa"/><text x="60" y="380.5" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">0</text><text x="82" y="381" font-size="15" font-weight="600" fill="#fafafa">Connector</text><text x="48" y="408" font-size="12.5" fill="#a1a1aa">teach the projector what [SEG] means</text><line x1="282" y1="387" x2="326" y2="387" stroke="#27272a" stroke-width="1.5"/><rect x="296.0" y="379" width="16" height="16" rx="3" transform="rotate(45 304.0 387)" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/><text x="304.0" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#a1a1aa">gate</text><rect x="328" y="350" width="248" height="74" rx="12" fill="#09090b" stroke="#27272a"/><circle cx="356" cy="376" r="12" fill="#fafafa"/><text x="356" y="380.5" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">1</text><text x="378" y="381" font-size="15" font-weight="600" fill="#fafafa">2D SFT</text><text x="344" y="408" font-size="12.5" fill="#a1a1aa">full reports + outlines, X-ray and slices</text><line x1="578" y1="387" x2="622" y2="387" stroke="#27272a" stroke-width="1.5"/><rect x="592.0" y="379" width="16" height="16" rx="3" transform="rotate(45 600.0 387)" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/><text x="600.0" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#a1a1aa">gate</text><rect x="624" y="350" width="248" height="74" rx="12" fill="#09090b" stroke="#27272a"/><circle cx="652" cy="376" r="12" fill="#fafafa"/><text x="652" y="380.5" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">2</text><text x="674" y="381" font-size="15" font-weight="600" fill="#fafafa">3D volumes</text><text x="640" y="408" font-size="12.5" fill="#a1a1aa">33-slice CT / MRI, 40% 2D replay</text><line x1="874" y1="387" x2="918" y2="387" stroke="#27272a" stroke-width="1.5"/><rect x="888.0" y="379" width="16" height="16" rx="3" transform="rotate(45 896.0 387)" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/><text x="896.0" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#a1a1aa">gate</text><rect x="920" y="350" width="248" height="74" rx="12" fill="#09090b" stroke="#27272a"/><circle cx="948" cy="376" r="12" fill="#fafafa"/><text x="948" y="380.5" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">3</text><text x="970" y="381" font-size="15" font-weight="600" fill="#fafafa">X-ray polish</text><text x="936" y="408" font-size="12.5" fill="#a1a1aa">15% 3D replay at 0.3× learning rate</text><line x1="9" y1="448" x2="1191" y2="448" stroke="#27272a"/><text x="32" y="488" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#fafafa">26.8K</text><text x="32" y="510" font-size="13" fill="#a1a1aa">training records</text><text x="259" y="488" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#fafafa">7</text><text x="259" y="510" font-size="13" fill="#a1a1aa">licensed datasets</text><text x="486" y="488" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#fafafa">3</text><text x="486" y="510" font-size="13" fill="#a1a1aa">modalities</text><text x="714" y="488" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#fafafa">~80 GB</text><text x="714" y="510" font-size="13" fill="#a1a1aa">training memory</text><text x="941" y="488" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#fafafa">62.6 GB</text><text x="941" y="510" font-size="13" fill="#a1a1aa">run 3 checkpoint</text></svg>
