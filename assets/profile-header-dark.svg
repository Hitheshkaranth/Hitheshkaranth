<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Hithesh Karanth</title>
  <desc id="description">CTO at FlyVI Technologies, open-source systems builder, and creator of Noyce IDE.</desc>
  
  <!-- Shadow -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window Background -->
  <rect x="20" y="20" width="1160" height="280" rx="16" fill="#1C1C1E" stroke="#38383A" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Window Controls -->
  <circle cx="44" cy="44" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
  <circle cx="64" cy="44" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
  <circle cx="84" cy="44" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>

  <!-- Logo (Dark Theme) -->
  <g transform="translate(576, 40)">
    <rect width="48" height="48" rx="12" fill="#2C2C2E" stroke="#38383A" stroke-width="1"/>
    <!-- Abstract Dark Theme Logo -->
    <path d="M24 12C17.3726 12 12 17.3726 12 24C12 30.6274 17.3726 36 24 36C30.6274 36 36 30.6274 36 24C36 17.3726 30.6274 12 24 12ZM24 33C19.0294 33 15 28.9706 15 24C15 19.0294 19.0294 15 24 15C28.9706 15 33 19.0294 33 24C33 28.9706 28.9706 33 24 33Z" fill="#2997FF"/>
    <path d="M24 18L28 24H20L24 18Z" fill="#2997FF"/>
  </g>

  <!-- Content -->
  <text x="600" y="140" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Hithesh Karanth</text>
  <text x="600" y="180" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="22" font-weight="500">CTO at FlyVI Technologies</text>
  <text x="600" y="215" text-anchor="middle" fill="#98989D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="18">Aerospace · Embedded systems · Developer tools · Open source</text>
  
  <line x1="450" y1="245" x2="750" y2="245" stroke="#38383A" stroke-width="1"/>
  
  <text x="600" y="275" text-anchor="middle" fill="#2997FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="600">Building Noyce IDE · Sarvam Epoch Buildathon winner</text>
</svg>
